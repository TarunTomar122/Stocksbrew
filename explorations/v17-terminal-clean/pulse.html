<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Market today // pulse</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<script>tailwind.config={theme:{extend:{colors:{bg:'#070b09',surface:'#0f1512',surface2:'#1a221c',line:'rgba(255,255,255,.06)',up:'#4ade80',down:'#fb7185',cyan:'#22d3ee',t1:'#f1f4f7',t2:'#9aa3af',t3:'#5b6573'},fontFamily:{mono:['"JetBrains Mono"','monospace'],sans:['Inter','sans-serif']}}}};</script>
<style>
  body{background:#070b09}
  .panel{background:#0f1512;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(74,222,128,.08)}
  .inset{background:#14191f;border-radius:10px}
  .dot{animation:p 2.4s ease-in-out infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
  .logo{width:24px;height:24px;border-radius:6px;background:#fff;object-fit:contain;padding:2px;flex:none}
  .lens{display:none}.lens.on{display:block}
</style>
</head>
<body class="font-sans text-t1 antialiased">
<div class="max-w-6xl mx-auto px-5 py-10">

  <!-- HEADER + SYNTHESIZED TOP-LINE -->
  <div class="mb-1 font-mono text-[12px] text-cyan">// market today</div>
  <div class="flex items-start justify-between gap-4">
    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-t1">The market, right now.</h1>
    <span class="flex items-center gap-1.5 font-mono text-[11px] text-t2 whitespace-nowrap mt-2"><span class="w-1.5 h-1.5 rounded-full bg-up dot"></span> live · 9:41a ET</span>
  </div>
  <p class="mt-3 max-w-3xl text-[15px] leading-relaxed text-t2">
    <b class="text-up">Risk-on.</b> Semis leading <span class="text-up">+6.1%</span>, defense lagging <span class="text-down">−3.3%</span>.
    <b class="text-t1">36 gainers</b> vs <b class="text-t1">14 losers</b> · crowd net <b class="text-up">bullish</b>.
  </p>

  <!-- LENS TABS -->
  <div class="mt-7 flex gap-1 border-b border-line font-mono text-[13px]">
    <button onclick="lens('movers')" id="t-movers" class="tab px-4 py-2.5 -mb-px border-b-2 border-up text-t1">Movers</button>
    <button onclick="lens('reddit')" id="t-reddit" class="tab px-4 py-2.5 -mb-px border-b-2 border-transparent text-t2 hover:text-t1">Reddit</button>
    <button onclick="lens('sectors')" id="t-sectors" class="tab px-4 py-2.5 -mb-px border-b-2 border-transparent text-t2 hover:text-t1">Sectors</button>
    <button class="px-4 py-2.5 text-t3 cursor-not-allowed">Earnings <span class="text-[10px]">soon</span></button>
  </div>

  <!-- LENS: MOVERS -->
  <div id="lens-movers" class="lens on pt-6">
    <div class="flex gap-1.5 mb-4 font-mono text-[12px]">
      <span class="px-3 py-1.5 rounded bg-surface2 text-t1">▲ gainers 36</span>
      <span class="px-3 py-1.5 rounded text-t2">▼ losers 14</span>
    </div>
    <div class="panel overflow-hidden" id="movers"></div>
  </div>

  <!-- LENS: REDDIT -->
  <div id="lens-reddit" class="lens pt-6">
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3" id="reddit"></div>
  </div>

  <!-- LENS: SECTORS -->
  <div id="lens-sectors" class="lens pt-6">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3" id="sectors"></div>
  </div>

</div>

<script>
const L=(t)=>`<img class="logo" src="https://assets.parqet.com/logos/symbol/${t}?format=png" onerror="this.style.display='none'"/>`;
function lens(k){
  ['movers','reddit','sectors'].forEach(x=>{
    document.getElementById('lens-'+x).classList.toggle('on',x===k);
    const tb=document.getElementById('t-'+x);
    tb.className='tab px-4 py-2.5 -mb-px border-b-2 '+(x===k?'border-up text-t1':'border-transparent text-t2 hover:text-t1');
  });
}

// MOVERS — with reddit cross-ref chip + gated verdict
const movers=[
  {t:'SMR',px:'11.74',chg:13.5,why:'Upcoming regulatory decisions or project milestones could ignite momentum.',buzz:'bullish'},
  {t:'GLW',px:'194.92',chg:11.1,why:'Upcoming earnings on Apr 28 will test if growth sustains beyond AI demand.'},
  {t:'INTC',px:'133.99',chg:10.6,why:"Apple partnership execution will confirm Intel's foundry growth path.",buzz:'mixed'},
  {t:'SMCI',px:'30.66',chg:10.4,why:'Earnings or a new product could reignite investor interest.'},
  {t:'MSFT',px:'478.30',chg:-1.3,why:'Software sector short squeeze; capex scrutiny weighs on sentiment.',buzz:'bearish'},
];
const chip=(b)=>{if(!b)return '';const c=b==='bearish'?'text-down':b==='bullish'?'text-up':'text-cyan';return `<span class="font-mono text-[10px] ${c}" style="background:rgba(255,255,255,.05);border-radius:5px;padding:2px 6px">💬 ${b}</span>`;};
document.getElementById('movers').innerHTML=movers.map(m=>{const up=m.chg>=0;return `
  <div class="border-t border-line px-5 py-4 first:border-t-0">
    <div class="flex items-center gap-3 font-mono text-[13px]">
      ${L(m.t)}<span class="font-bold text-t1">${m.t}</span>
      ${chip(m.buzz)}
      <span class="ml-auto flex flex-col items-end leading-tight">
        <span class="text-t1">$${m.px}</span>
        <span class="mt-0.5 ${up?'text-up':'text-down'} text-[12px]">${up?'▲':'▼'} ${Math.abs(m.chg).toFixed(2)}%</span>
      </span>
      <span class="ml-3 font-mono text-[11px] text-t3" style="border:1px solid rgba(255,255,255,.12);border-radius:5px;padding:2px 8px">🔒 call</span>
    </div>
    <p class="mt-3 text-[13px] leading-relaxed text-t2">${m.why}</p>
  </div>`;}).join('');

// REDDIT
const reddit=[
  {t:'RDDT',m:2,s:'mixed',txt:"Reddit's Q1 showed strong revenue growth and improved margins, but some warn it's a value trap."},
  {t:'MSFT',m:2,s:'bearish',txt:'Short interest in Microsoft up significantly amid a broader software short squeeze.'},
  {t:'SNAP',m:1,s:'bearish',txt:'Snap faces intense competition from TikTok and Meta; weak performance and mgmt concerns.'},
  {t:'CCL',m:1,s:'bullish',txt:'Carnival shows strong bookings and pricing, trading well below pre-Covid highs.'},
];
document.getElementById('reddit').innerHTML=reddit.map(r=>{const c=r.s==='bearish'?'text-down':r.s==='bullish'?'text-up':'text-cyan';return `
  <div class="panel p-4">
    <div class="flex items-center gap-2 mb-1.5 font-mono text-[12px]">${L(r.t)}<span class="font-bold text-t1">${r.t}</span><span class="text-t2">${r.m} mentions</span><span class="ml-auto ${c} text-[10px]" style="background:rgba(255,255,255,.05);border-radius:5px;padding:2px 6px">${r.s}</span></div>
    <p class="text-[13px] leading-relaxed text-t2">${r.txt}</p>
  </div>`;}).join('');

// SECTORS
const sectors=[['Semis',6.1,[['SMCI',10.4],['MU',6.1],['INTC',4.9],['TSM',2.4],['NVDA',1.3]]],['Tech',-1.1,[['AAPL',0.6],['MSFT',-0.5],['META',-0.8],['ADBE',-0.8],['CRM',-1.0]]],['Industrials',0.7,[['CAT',2.6],['ETN',1.7],['DE',1.2],['HON',0.6],['GE',0.5]]],['Finance',1.0,[['BAC',1.8],['WFC',1.5],['JPM',1.3],['GS',1.2],['MS',1.2]]]];
document.getElementById('sectors').innerHTML=sectors.map(([name,avg,rows])=>`
  <div class="panel p-5">
    <div class="flex items-center justify-between mb-4"><span class="text-[15px] font-semibold text-t1">${name}</span><span class="font-mono text-[13px] font-bold ${avg>=0?'text-up':'text-down'}">${avg>=0?'▲':'▼'} ${Math.abs(avg).toFixed(2)}%</span></div>
    <div>${rows.map(([t,c])=>`<a class="flex items-center gap-2.5 border-t border-line py-2.5 first:border-t-0"> ${L(t)}<span class="font-mono text-[13px] text-t1">${t}</span><span class="ml-auto font-mono text-[13px] ${c>=0?'text-up':'text-down'}">${c>=0?'▲':'▼'} ${Math.abs(c).toFixed(2)}%</span></a>`).join('')}</div>
  </div>`).join('');
</script>
</body>
</html>
