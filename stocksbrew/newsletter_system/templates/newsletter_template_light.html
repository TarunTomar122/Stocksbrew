<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Newsletter - ${date}</title>
    <style>
        /* Light mode colors */
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --card-bg: #f8f9fa;
            --border-color: #e0e0e0;
            --header-bg: #f1f3f5;
            --link-color: #0066cc;
            --bullish-color: #28a745;
            --bearish-color: #dc3545;
            --neutral-color: #6c757d;
            --icon-bg: #e9ecef;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--bg-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .newsletter-header {
            background-color: var(--header-bg);
            padding: 30px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .newsletter-header h1 {
            margin: 0;
            color: var(--text-color);
            font-size: 24px;
            font-weight: 600;
        }

        .newsletter-date {
            color: var(--neutral-color);
            font-size: 14px;
            margin-top: 5px;
        }

        .market-overview {
            background-color: var(--card-bg);
            padding: 25px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .market-overview h1 {
            color: var(--text-color);
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .market-overview h2 {
            color: var(--text-color);
            font-size: 20px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .market-overview h3 {
            color: var(--text-color);
            font-size: 18px;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        .overview-list {
            margin: 10px 0;
            padding-left: 20px;
        }

        .overview-list li {
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .stock-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
            padding: 20px;
        }

        .stock-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .stock-icon {
            width: 50px;
            height: 50px;
            background-color: var(--icon-bg);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: var(--text-color);
            margin-right: 15px;
        }

        .stock-title {
            flex-grow: 1;
        }

        .stock-title h2 {
            margin: 0;
            font-size: 20px;
            color: var(--text-color);
        }

        .stock-symbol {
            color: var(--neutral-color);
            font-size: 14px;
            margin-top: 3px;
        }

        .section {
            margin-bottom: 20px;
        }

        .section h3 {
            font-size: 16px;
            color: var(--text-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .section-icon {
            margin-right: 8px;
            font-size: 18px;
        }

        .tldr {
            background-color: var(--header-bg);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .tldr h3 {
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--text-color);
            font-size: 16px;
        }

        .tldr p {
            margin: 0;
            color: var(--text-color);
        }

        ul {
            margin: 0;
            padding-left: 20px;
        }

        li {
            margin-bottom: 5px;
            color: var(--text-color);
        }

        .sentiment {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: 500;
        }

        .sentiment.bullish {
            background-color: rgba(40, 167, 69, 0.1);
            color: var(--bullish-color);
        }

        .sentiment.bearish {
            background-color: rgba(220, 53, 69, 0.1);
            color: var(--bearish-color);
        }

        .sentiment.neutral {
            background-color: rgba(108, 117, 125, 0.1);
            color: var(--neutral-color);
        }

        .rating {
            display: flex;
            align-items: center;
        }

        .stars {
            color: #ffc107;
            font-size: 18px;
            margin-right: 8px;
        }

        .rating-text {
            color: var(--text-color);
        }

        .news-links a {
            color: var(--link-color);
            text-decoration: none;
        }

        .news-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .newsletter-header {
                padding: 20px;
            }

            .stock-section {
                padding: 15px;
            }

            .stock-icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            .stock-title h2 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="newsletter-header">
            <h1>Stock Market Newsletter</h1>
            <div class="newsletter-date">${date}</div>
        </div>

        <div class="market-overview">
            ${market_overview}
        </div>

        ${stock_sections}
    </div>
</body>
</html>
