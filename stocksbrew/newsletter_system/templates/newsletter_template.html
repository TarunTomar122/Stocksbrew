<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{newsletter_title}}</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 
                        'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            background-color: #f8fafc;
            color: #1a202c;
            margin: 0;
            padding: 0;
            width: 100% !important;
            min-width: 100%;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }
        
        /* Container */
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        
        .header .subtitle {
            font-size: 16px;
            opacity: 0.9;
            font-weight: 400;
        }
        
        .header .date {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 12px;
            font-weight: 300;
        }
        
        /* Content */
        .content {
            padding: 0;
        }
        
        /* Stock section */
        .stock-section {
            padding: 30px;
            border-bottom: 1px solid #e2e8f0;
            position: relative;
        }
        
        .stock-section:last-child {
            border-bottom: none;
        }
        
        .stock-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
        }
        
        .stock-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #4299e1, #3182ce);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 20px;
            font-weight: bold;
            color: white;
        }
        
        .stock-title {
            flex: 1;
        }
        
        .stock-title h2 {
            font-size: 24px;
            color: #2d3748;
            margin-bottom: 4px;
            font-weight: 600;
        }
        
        .stock-symbol {
            font-size: 14px;
            color: #718096;
            font-weight: 500;
        }
        
        /* TL;DR Section */
        .tldr {
            background: linear-gradient(135deg, #fef5e7, #fed7aa);
            border-left: 4px solid #f6ad55;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
        }
        
        .tldr h3 {
            color: #c05621;
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .tldr p {
            color: #744210;
            font-size: 15px;
            line-height: 1.5;
            margin: 0;
        }
        
        /* Section styles */
        .section {
            margin-bottom: 25px;
        }
        
        .section h3 {
            font-size: 18px;
            color: #2d3748;
            margin-bottom: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }
        
        .section-icon {
            margin-right: 8px;
            font-size: 20px;
        }
        
        .section ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .section li {
            padding: 8px 0;
            padding-left: 20px;
            position: relative;
            color: #4a5568;
            line-height: 1.5;
        }
        
        .section li:before {
            content: "•";
            color: #4299e1;
            font-weight: bold;
            position: absolute;
            left: 0;
        }
        
        /* Rating styles */
        .rating {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        
        .stars {
            color: #f6ad55;
            font-size: 18px;
            letter-spacing: 2px;
        }
        
        .rating-text {
            color: #2d3748;
            font-weight: 500;
        }
        
        /* Sentiment badge */
        .sentiment {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .sentiment.bullish {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .sentiment.bearish {
            background: #fed7d7;
            color: #742a2a;
        }
        
        .sentiment.neutral {
            background: #e2e8f0;
            color: #4a5568;
        }
        
        /* Links */
        .news-links a {
            color: #4299e1;
            text-decoration: none;
            font-weight: 500;
        }
        
        .news-links a:hover {
            text-decoration: underline;
        }
        
        /* Footer */
        .footer {
            background: #2d3748;
            color: #a0aec0;
            padding: 30px;
            text-align: center;
        }
        
        .footer p {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .footer a {
            color: #63b3ed;
            text-decoration: none;
        }
        
        /* Responsive */
        @media only screen and (max-width: 600px) {
            .email-container {
                margin: 0;
                border-radius: 0;
            }
            
            .header {
                padding: 30px 20px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .stock-section {
                padding: 20px;
            }
            
            .stock-header {
                flex-direction: column;
                text-align: center;
            }
            
            .stock-icon {
                margin-right: 0;
                margin-bottom: 10px;
            }
            
            .rating {
                flex-direction: column;
                text-align: center;
            }
        }
        
        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            .email-container {
                background-color: #1a202c;
            }
            
            .stock-section {
                border-bottom-color: #2d3748;
            }
            
            .section h3,
            .stock-title h2 {
                color: #e2e8f0;
            }
            
            .section li {
                color: #a0aec0;
            }
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Header -->
        <div class="header">
            <h1>📈 StocksBrew Newsletter</h1>
            <div class="subtitle">Your Daily Stock Market Intelligence</div>
            <div class="date">{{date}}</div>
        </div>
        
        <!-- Content -->
        <div class="content">
            {{stock_sections}}
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <p>
                Generated with ❤️ by StocksBrew<br>
                <small>This newsletter is for informational purposes only and should not be considered as financial advice.</small>
            </p>
        </div>
    </div>
</body>
</html>
