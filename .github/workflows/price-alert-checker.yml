name: Price alert checker

on:
  schedule:
    # Every 15 min Mon-Fri 9:30 AM - 4:15 PM ET (13:30 - 20:15 UTC / 14:30 - 21:15 UTC DST)
    - cron: "30,45 13-19 * * 1-5"
    - cron: "0,15,30,45 20 * * 1-5"
    - cron: "30,45 14-20 * * 1-5"
    - cron: "0,15,30,45 21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: price-alert-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    env:
      PYTHONUNBUFFERED: "1"
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      EMAILS_ENABLED: "1"
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Check price alerts
        run: python -m backend.scripts.check_price_alerts
