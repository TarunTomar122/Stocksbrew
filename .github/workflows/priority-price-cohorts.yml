name: Priority price cohorts

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market to refresh"
        required: false
        default: "US"
      universe:
        description: "Optional price universe id (defaults to active Firestore config)"
        required: false
        default: ""
      limit:
        description: "Total priority instruments"
        required: false
        default: "100"
      cohort_size:
        description: "Instruments per cohort"
        required: false
        default: "30"
      max_workers:
        description: "Yfinance workers per cohort"
        required: false
        default: "6"
      session_phase:
        description: "Price phase"
        required: false
        default: "post_close"
      dry_run:
        description: "Plan cohorts without writing"
        required: false
        default: "false"
  schedule:
    # US market open refresh during daylight saving time.
    - cron: "35 13 * * 1-5"
    # US market open refresh during standard time.
    - cron: "35 14 * * 1-5"
    # US intraday hourly refresh during daylight saving time (10:35-15:35 ET).
    - cron: "35 14-19 * * 1-5"
    # US intraday hourly refresh during standard time (10:35-15:35 ET).
    - cron: "35 15-20 * * 1-5"
    # US post-close during daylight saving time.
    - cron: "30 21 * * 1-5"
    # US post-close during standard time. The duplicate schedule is acceptable;
    # the job is cheap and keeps the setup simple until we move scheduling into
    # a market-calendar aware runner.
    - cron: "30 22 * * 1-5"

concurrency:
  group: priority-price-cohorts-${{ github.event.inputs.market || 'US' }}
  cancel-in-progress: false

jobs:
  run:
    name: Refresh priority cohorts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    env:
      PYTHONUNBUFFERED: "1"
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Guard scheduled ET windows
        if: ${{ github.event_name == 'schedule' }}
        id: schedule_guard
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          import os

          now_et = datetime.now(ZoneInfo("America/New_York"))
          hm = now_et.strftime("%H:%M")
          minute_of_day = now_et.hour * 60 + now_et.minute
          in_open_window = (9 * 60 + 30) <= minute_of_day <= (9 * 60 + 45)
          in_mid_window = (10 * 60 + 30) <= minute_of_day <= (16 * 60 + 5)
          in_close_window = (17 * 60 + 25) <= minute_of_day <= (17 * 60 + 45)
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          if not (in_open_window or in_mid_window or in_close_window):
            print("Skipping duplicate cron trigger at ET "
                  f"{hm}; allowed windows: 09:30-09:45, 10:30-16:05, 17:25-17:45")
            output_path.write_text("run=false\nsession_phase=manual\n", encoding="utf-8")
            raise SystemExit(0)
          if in_open_window:
            phase = "open_check"
          elif in_close_window:
            phase = "post_close"
          else:
            phase = "mid_check"
          print(f"Proceeding at ET {hm}")
          output_path.write_text(f"run=true\nsession_phase={phase}\n", encoding="utf-8")
          PY

      - name: Check out repository
        if: ${{ github.event_name != 'schedule' || steps.schedule_guard.outputs.run == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ github.event_name != 'schedule' || steps.schedule_guard.outputs.run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        if: ${{ github.event_name != 'schedule' || steps.schedule_guard.outputs.run == 'true' }}
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Validate required secrets
        if: ${{ github.event_name != 'schedule' || steps.schedule_guard.outputs.run == 'true' }}
        run: test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON secret" && exit 1)

      - name: Run priority cohort refresh
        if: ${{ github.event_name != 'schedule' || steps.schedule_guard.outputs.run == 'true' }}
        run: |
          MARKET="${{ github.event.inputs.market || 'US' }}"
          UNIVERSE="${{ github.event.inputs.universe || '' }}"
          LIMIT="${{ github.event.inputs.limit || '100' }}"
          COHORT_SIZE="${{ github.event.inputs.cohort_size || '30' }}"
          MAX_WORKERS="${{ github.event.inputs.max_workers || '6' }}"
          SESSION_PHASE="${{ github.event_name == 'schedule' && steps.schedule_guard.outputs.session_phase || github.event.inputs.session_phase || 'post_close' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          CMD=(
            python -m backend.scripts.run_priority_price_pipeline
            --market "$MARKET"
            --limit "$LIMIT"
            --cohort-size "$COHORT_SIZE"
            --max-workers "$MAX_WORKERS"
            --session-phase "$SESSION_PHASE"
          )

          if [ -n "$UNIVERSE" ]; then
            CMD+=(--universe "$UNIVERSE")
          fi

          if [ "$DRY_RUN" = "true" ]; then
            CMD+=(--dry-run)
          fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Refresh user alerts and watchlist views
        if: ${{ github.event_name != 'schedule' || steps.schedule_guard.outputs.run == 'true' }}
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}
        run: |
          MARKET="${{ github.event.inputs.market || 'US' }}"
          python -m backend.scripts.run_pipeline \
            --markets "$MARKET" \
            --session-phase manual \
            --force "$MARKET:build_user_alert_flags" \
            --force "GLOBAL:build_watchlist_views"
