name: Paid AI briefs

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market to refresh"
        required: false
        default: "US"
      universe:
        description: "Optional AI universe id (defaults to active Firestore config)"
        required: false
        default: ""
      per_stock_cap:
        description: "Max articles per stock"
        required: false
        default: "5"
      chunk_workers:
        description: "Parallel news chunk workers"
        required: false
        default: "4"
  schedule:
    # 30-50 minutes before US open, DST and standard-time windows.
    - cron: "45 12 * * 1-5"
    - cron: "45 13 * * 1-5"
    # Shortly after US close, DST and standard-time windows.
    - cron: "40 21 * * 1-5"
    - cron: "40 22 * * 1-5"

concurrency:
  group: paid-ai-briefs-${{ github.event.inputs.market || 'US' }}
  cancel-in-progress: false

jobs:
  run:
    name: Refresh paid tracked AI briefs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      PYTHONUNBUFFERED: "1"
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}

    steps:
      - name: Guard scheduled ET windows
        if: ${{ github.event_name == 'schedule' }}
        id: schedule_guard
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          import os

          now_et = datetime.now(ZoneInfo("America/New_York"))
          hm = now_et.strftime("%H:%M")
          allowed = {"08:45", "17:40"}
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          if hm not in allowed:
            print(f"Skipping duplicate cron trigger at ET {hm}; allowed windows: {sorted(allowed)}")
            output_path.write_text("run=false\n", encoding="utf-8")
            raise SystemExit(0)
          print(f"Proceeding at ET {hm}")
          output_path.write_text("run=true\n", encoding="utf-8")
          PY

      - name: Check out repository
        if: ${{ github.event_name != 'schedule' || steps.schedule_guard.outputs.run == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ github.event_name != 'schedule' || steps.schedule_guard.outputs.run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        if: ${{ github.event_name != 'schedule' || steps.schedule_guard.outputs.run == 'true' }}
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Validate required secrets
        if: ${{ github.event_name != 'schedule' || steps.schedule_guard.outputs.run == 'true' }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON secret" && exit 1)
          test -n "$MIMO_API_KEY" || (echo "Missing MIMO_API_KEY secret" && exit 1)

      - name: Refresh paid AI briefs
        if: ${{ github.event_name != 'schedule' || steps.schedule_guard.outputs.run == 'true' }}
        run: |
          MARKET="${{ github.event.inputs.market || 'US' }}"
          UNIVERSE="${{ github.event.inputs.universe || '' }}"
          PER_STOCK_CAP="${{ github.event.inputs.per_stock_cap || '5' }}"
          CHUNK_WORKERS="${{ github.event.inputs.chunk_workers || '4' }}"
          CMD=(
            python -m backend.scripts.build_per_stock_intelligence
            --market "$MARKET"
            --paid-only
            --upsert
            --per-stock-cap "$PER_STOCK_CAP"
            --broad-cap 0
            --chunk-size 10
            --chunk-workers "$CHUNK_WORKERS"
            --skip-context
            --skip-materialize
          )

          if [ -n "$UNIVERSE" ]; then
            CMD+=(--universe "$UNIVERSE")
          fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Materialize post-AI views
        if: ${{ github.event_name != 'schedule' || steps.schedule_guard.outputs.run == 'true' }}
        run: |
          MARKET="${{ github.event.inputs.market || 'US' }}"
          python -m backend.scripts.materialize_views \
            --market "$MARKET" \
            --paid-only \
            --skip-dashboard \
            --allow-missing-context \
            --skip-sector-scrape
