name: Backend data pipeline

on:
  workflow_dispatch:
    inputs:
      markets:
        description: "Comma-separated markets to run"
        required: false
        default: "US"
      session_phase:
        description: "Price phase: auto, pre_open, open_check, mid_check, close_check, post_close, manual"
        required: false
        default: "auto"
      force:
        description: "Optional stage key to force, or 'all'"
        required: false
        default: ""
  schedule:
    # India market windows are disabled while we focus the app on US-only data.
    # - cron: "50 3 * * 1-5"
    # - cron: "30 7 * * 1-5"
    # - cron: "10 10 * * 1-5"

    # US market windows during daylight saving time, UTC.
    - cron: "5 13 * * 1-5"
    - cron: "45 13 * * 1-5"
    - cron: "0 17 * * 1-5"
    - cron: "55 19 * * 1-5"
    - cron: "30 21 * * 1-5"

    # US market windows during standard time, UTC. The runner's auto phase
    # check skips these during daylight saving time when they are outside the
    # valid window.
    - cron: "5 14 * * 1-5"
    - cron: "45 14 * * 1-5"
    - cron: "0 18 * * 1-5"
    - cron: "55 20 * * 1-5"
    - cron: "30 22 * * 1-5"

    # Weekend maintenance pass for stale non-price data and cached views.
    - cron: "30 2 * * 6"

concurrency:
  group: backend-data-pipeline
  cancel-in-progress: false

jobs:
  run:
    name: Run stale backend stages
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read

    env:
      PYTHONUNBUFFERED: "1"
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Validate required secrets
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON secret" && exit 1)
          test -n "$MIMO_API_KEY" || (echo "Missing MIMO_API_KEY secret" && exit 1)

      - name: Run pipeline
        run: |
          MARKETS="${{ github.event.inputs.markets || 'US' }}"
          SESSION_PHASE="${{ github.event.inputs.session_phase || 'auto' }}"
          FORCE="${{ github.event.inputs.force || '' }}"

          CMD=(python -m backend.scripts.run_pipeline --markets "$MARKETS" --session-phase "$SESSION_PHASE")
          if [ -n "$FORCE" ]; then
            CMD+=(--force "$FORCE")
          fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"
