name: Backend data pipeline

on:
  workflow_dispatch:
    inputs:
      markets:
        description: "Comma-separated markets to run"
        required: false
        default: "US"
      session_phase:
        description: "Price phase: auto, pre_open, open_check, mid_check, close_check, post_close, manual"
        required: false
        default: "auto"
      force:
        description: "Optional stage key(s) to force, comma-separated or repeated manually"
        required: false
        default: ""
  schedule:
    # Weekend-only deep maintenance. Weekday price/AI refresh now runs via
    # dedicated priority-price and paid-ai workflows.
    - cron: "30 2 * * 6"
    - cron: "30 2 * * 0"

concurrency:
  group: backend-data-pipeline
  cancel-in-progress: false

jobs:
  run:
    name: Run stale backend stages
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read

    env:
      PYTHONUNBUFFERED: "1"
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Validate required secrets
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON secret" && exit 1)
          test -n "$MIMO_API_KEY" || (echo "Missing MIMO_API_KEY secret" && exit 1)

      - name: Run pipeline
        run: |
          MARKETS="${{ github.event.inputs.markets || 'US' }}"
          SESSION_PHASE="${{ github.event.inputs.session_phase || 'auto' }}"
          FORCE="${{ github.event.inputs.force || '' }}"

          CMD=(python -m backend.scripts.run_pipeline --markets "$MARKETS" --session-phase "$SESSION_PHASE")
          if [ -n "$FORCE" ]; then
            IFS=',' read -r -a FORCE_KEYS <<< "$FORCE"
            for force_key in "${FORCE_KEYS[@]}"; do
              key="$(echo "$force_key" | xargs)"
              if [ -n "$key" ]; then
                CMD+=(--force "$key")
              fi
            done
          fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"
