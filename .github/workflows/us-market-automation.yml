name: US market automation

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run: preopen_news | price_refresh | open_briefs | close_briefs"
        required: false
        default: "price_refresh"
      session_phase:
        description: "For price_refresh only: auto | open_check | mid_check | close_check | post_close | manual"
        required: false
        default: "auto"
      universe:
        description: "Optional universe id (uses active config when empty)"
        required: false
        default: ""
      limit:
        description: "Priority instruments for price refresh"
        required: false
        default: "100"
      cohort_size:
        description: "Instruments per cohort"
        required: false
        default: "30"
      max_workers:
        description: "Yfinance workers per cohort"
        required: false
        default: "6"
      per_stock_cap:
        description: "Max news articles per stock for briefs"
        required: false
        default: "5"
      chunk_workers:
        description: "Parallel fetch workers for news/brief runs"
        required: false
        default: "4"
      dry_run:
        description: "Only for price_refresh"
        required: false
        default: "false"
  schedule:
    # Pre-open tracked news (08:55 ET) - DST + standard time windows.
    - cron: "55 12 * * 1-5"
    - cron: "55 13 * * 1-5"
    # Market open + every 30 minutes through close (US regular session).
    - cron: "30 13 * * 1-5"
    - cron: "30 14 * * 1-5"
    - cron: "0,30 14-19 * * 1-5"
    - cron: "0 20 * * 1-5"
    - cron: "0,30 15-20 * * 1-5"
    - cron: "0 21 * * 1-5"
    # Open-phase briefs (09:35 ET) - DST + standard time windows.
    - cron: "35 13 * * 1-5"
    - cron: "35 14 * * 1-5"
    # Post-close briefs (17:40 ET) - DST + standard time windows.
    - cron: "40 21 * * 1-5"
    - cron: "40 22 * * 1-5"

concurrency:
  group: us-market-automation
  cancel-in-progress: false

jobs:
  decide:
    name: Resolve phase
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.resolve.outputs.run }}
      task: ${{ steps.resolve.outputs.task }}
      session_phase: ${{ steps.resolve.outputs.session_phase }}
    steps:
      - name: Resolve scheduled/manual task
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule || '' }}
          INPUT_TASK: ${{ github.event.inputs.task || '' }}
          INPUT_SESSION_PHASE: ${{ github.event.inputs.session_phase || 'auto' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          event_name = os.environ.get("EVENT_NAME", "")
          schedule_expr = os.environ.get("SCHEDULE_EXPR", "").strip()
          input_task = (os.environ.get("INPUT_TASK", "") or "").strip()
          input_session_phase = (os.environ.get("INPUT_SESSION_PHASE", "auto") or "auto").strip()

          preopen_exprs = {"55 12 * * 1-5", "55 13 * * 1-5"}
          open_briefs_exprs = {"35 13 * * 1-5", "35 14 * * 1-5"}
          close_briefs_exprs = {"40 21 * * 1-5", "40 22 * * 1-5"}
          price_open_exprs = {"30 13 * * 1-5", "30 14 * * 1-5"}
          price_close_exprs = {"0 20 * * 1-5", "0 21 * * 1-5"}
          price_mid_exprs = {"0,30 14-19 * * 1-5", "0,30 15-20 * * 1-5"}

          run = True
          task = ""
          session_phase = "manual"

          if event_name == "schedule":
              if schedule_expr in preopen_exprs:
                  task = "preopen_news"
              elif schedule_expr in open_briefs_exprs:
                  task = "open_briefs"
              elif schedule_expr in close_briefs_exprs:
                  task = "close_briefs"
              elif schedule_expr in price_open_exprs:
                  task = "price_refresh"
                  session_phase = "open_check"
              elif schedule_expr in price_close_exprs:
                  task = "price_refresh"
                  session_phase = "close_check"
              elif schedule_expr in price_mid_exprs:
                  task = "price_refresh"
                  session_phase = "mid_check"
              else:
                  run = False
                  print(f"Unknown schedule expression: {schedule_expr!r}")
          else:
              allowed = {"preopen_news", "price_refresh", "open_briefs", "close_briefs"}
              if input_task in allowed:
                  task = input_task
              else:
                  run = False
                  print(f"Invalid manual task: {input_task!r}. Allowed: {sorted(allowed)}")
              if task == "price_refresh":
                  session_phase = input_session_phase if input_session_phase else "auto"

          payload = [
              f"run={'true' if run else 'false'}",
              f"task={task}",
              f"session_phase={session_phase}",
          ]
          output_path.write_text("\n".join(payload) + "\n", encoding="utf-8")
          print("\n".join(payload))
          PY

  preopen_news:
    name: Pre-open tracked news
    needs: decide
    if: ${{ needs.decide.outputs.run == 'true' && needs.decide.outputs.task == 'preopen_news' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}
      WEB_REVALIDATE_BASE_URL: ${{ secrets.WEB_REVALIDATE_BASE_URL }}
      WEB_REVALIDATE_TOKEN: ${{ secrets.WEB_REVALIDATE_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Validate required secrets
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON secret" && exit 1)
          test -n "$MIMO_API_KEY" || (echo "Missing MIMO_API_KEY secret" && exit 1)

      - name: Run tracked pre-open news refresh
        run: |
          UNIVERSE="${{ github.event.inputs.universe || '' }}"
          PER_STOCK_CAP="${{ github.event.inputs.per_stock_cap || '5' }}"
          CHUNK_WORKERS="${{ github.event.inputs.chunk_workers || '4' }}"
          CMD=(
            python -m backend.scripts.build_per_stock_intelligence
            --market US
            --paid-only
            --upsert
            --per-stock-cap "$PER_STOCK_CAP"
            --broad-cap 0
            --chunk-size 10
            --chunk-workers "$CHUNK_WORKERS"
            --skip-context
            --skip-materialize
          )
          if [ -n "$UNIVERSE" ]; then
            CMD+=(--universe "$UNIVERSE")
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Revalidate web cache
        run: python -m backend.scripts.trigger_web_revalidate

  price_refresh:
    name: Priority price refresh
    needs: decide
    if: ${{ needs.decide.outputs.run == 'true' && needs.decide.outputs.task == 'price_refresh' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      WEB_REVALIDATE_BASE_URL: ${{ secrets.WEB_REVALIDATE_BASE_URL }}
      WEB_REVALIDATE_TOKEN: ${{ secrets.WEB_REVALIDATE_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Validate required secrets
        run: test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON secret" && exit 1)

      - name: Refresh 100-stock priority cohorts
        run: |
          UNIVERSE="${{ github.event.inputs.universe || '' }}"
          LIMIT="${{ github.event.inputs.limit || '100' }}"
          COHORT_SIZE="${{ github.event.inputs.cohort_size || '30' }}"
          MAX_WORKERS="${{ github.event.inputs.max_workers || '6' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          SESSION_PHASE="${{ needs.decide.outputs.session_phase || 'mid_check' }}"

          CMD=(
            python -m backend.scripts.run_priority_price_pipeline
            --market US
            --limit "$LIMIT"
            --cohort-size "$COHORT_SIZE"
            --max-workers "$MAX_WORKERS"
            --session-phase "$SESSION_PHASE"
          )
          if [ -n "$UNIVERSE" ]; then
            CMD+=(--universe "$UNIVERSE")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            CMD+=(--dry-run)
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Revalidate web cache
        run: python -m backend.scripts.trigger_web_revalidate

  open_briefs:
    name: Open-phase briefs, radar, digest
    needs: decide
    if: ${{ needs.decide.outputs.run == 'true' && needs.decide.outputs.task == 'open_briefs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      WEB_REVALIDATE_BASE_URL: ${{ secrets.WEB_REVALIDATE_BASE_URL }}
      WEB_REVALIDATE_TOKEN: ${{ secrets.WEB_REVALIDATE_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Validate required secrets
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON secret" && exit 1)
          test -n "$MIMO_API_KEY" || (echo "Missing MIMO_API_KEY secret" && exit 1)

      - name: Build tracked AI briefs (open phase)
        run: |
          UNIVERSE="${{ github.event.inputs.universe || '' }}"
          PER_STOCK_CAP="${{ github.event.inputs.per_stock_cap || '5' }}"
          CHUNK_WORKERS="${{ github.event.inputs.chunk_workers || '4' }}"
          CMD=(
            python -m backend.scripts.build_per_stock_intelligence
            --market US
            --paid-only
            --upsert
            --per-stock-cap "$PER_STOCK_CAP"
            --broad-cap 0
            --chunk-size 10
            --chunk-workers "$CHUNK_WORKERS"
            --skip-context
            --skip-materialize
          )
          if [ -n "$UNIVERSE" ]; then
            CMD+=(--universe "$UNIVERSE")
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Rebuild heat list (open phase)
        run: |
          UNIVERSE="${{ github.event.inputs.universe || '' }}"
          CMD=(
            python -m backend.scripts.build_heat_list
            --market US
          )
          if [ -n "$UNIVERSE" ]; then
            CMD+=(--ai-universe "$UNIVERSE" --price-universe "$UNIVERSE")
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Rebuild thematic screens (open phase)
        run: |
          UNIVERSE="${{ github.event.inputs.universe || '' }}"
          if [ -z "$UNIVERSE" ]; then
            UNIVERSE="$(python - <<'PY'
          from backend.storage import TraceMoneyStore
          store = TraceMoneyStore()
          print(store.get_active_price_universe("US") or "")
          PY
          )"
          fi
          if [ -z "$UNIVERSE" ]; then
            echo "Missing active US price universe for thematic screens"
            exit 1
          fi
          CMD=(
            python -m backend.scripts.build_thematic_screens
            --market US
            --universe "$UNIVERSE"
          )
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Materialize paid views
        run: |
          python -m backend.scripts.materialize_views \
            --market US \
            --paid-only \
            --skip-dashboard \
            --allow-missing-context \
            --skip-sector-scrape

      - name: Refresh paid Radar views
        run: python -m backend.scripts.build_watchlist_views --no-llm

      - name: Send pro daily digest (open phase)
        run: |
          python - <<'PY'
          from backend.storage import TraceMoneyStore
          from backend.scripts.send_lifecycle_emails import RunCache, _process_pro_daily_digest

          store = TraceMoneyStore()
          cache = RunCache(store)
          sent = _process_pro_daily_digest(store, cache)
          print(f"pro_daily_digest_sent={sent}")
          PY

      - name: Revalidate web cache
        run: python -m backend.scripts.trigger_web_revalidate

  close_briefs:
    name: Close-phase briefs and radar
    needs: decide
    if: ${{ needs.decide.outputs.run == 'true' && needs.decide.outputs.task == 'close_briefs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}
      WEB_REVALIDATE_BASE_URL: ${{ secrets.WEB_REVALIDATE_BASE_URL }}
      WEB_REVALIDATE_TOKEN: ${{ secrets.WEB_REVALIDATE_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Validate required secrets
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON secret" && exit 1)
          test -n "$MIMO_API_KEY" || (echo "Missing MIMO_API_KEY secret" && exit 1)

      - name: Build tracked AI briefs (close phase)
        run: |
          UNIVERSE="${{ github.event.inputs.universe || '' }}"
          PER_STOCK_CAP="${{ github.event.inputs.per_stock_cap || '5' }}"
          CHUNK_WORKERS="${{ github.event.inputs.chunk_workers || '4' }}"
          CMD=(
            python -m backend.scripts.build_per_stock_intelligence
            --market US
            --paid-only
            --upsert
            --per-stock-cap "$PER_STOCK_CAP"
            --broad-cap 0
            --chunk-size 10
            --chunk-workers "$CHUNK_WORKERS"
            --skip-context
            --skip-materialize
          )
          if [ -n "$UNIVERSE" ]; then
            CMD+=(--universe "$UNIVERSE")
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Rebuild heat list (close phase)
        run: |
          UNIVERSE="${{ github.event.inputs.universe || '' }}"
          CMD=(
            python -m backend.scripts.build_heat_list
            --market US
          )
          if [ -n "$UNIVERSE" ]; then
            CMD+=(--ai-universe "$UNIVERSE" --price-universe "$UNIVERSE")
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Rebuild thematic screens (close phase)
        run: |
          UNIVERSE="${{ github.event.inputs.universe || '' }}"
          if [ -z "$UNIVERSE" ]; then
            UNIVERSE="$(python - <<'PY'
          from backend.storage import TraceMoneyStore
          store = TraceMoneyStore()
          print(store.get_active_price_universe("US") or "")
          PY
          )"
          fi
          if [ -z "$UNIVERSE" ]; then
            echo "Missing active US price universe for thematic screens"
            exit 1
          fi
          CMD=(
            python -m backend.scripts.build_thematic_screens
            --market US
            --universe "$UNIVERSE"
          )
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Materialize paid views
        run: |
          python -m backend.scripts.materialize_views \
            --market US \
            --paid-only \
            --skip-dashboard \
            --allow-missing-context \
            --skip-sector-scrape

      - name: Refresh paid Radar views
        run: python -m backend.scripts.build_watchlist_views --no-llm

      - name: Revalidate web cache
        run: python -m backend.scripts.trigger_web_revalidate
