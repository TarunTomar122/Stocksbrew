name: Weekly stock facts refresh

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market to refresh"
        required: false
        default: "US"
      universe:
        description: "Optional universe id (defaults to active Firestore config)"
        required: false
        default: ""
      max_workers:
        description: "Parallel scraper workers"
        required: false
        default: "4"
      pause:
        description: "Pause between per-stock fetches (seconds)"
        required: false
        default: "0.25"
      limit:
        description: "How many priority instruments to refresh"
        required: false
        default: "100"


concurrency:
  group: weekly-stock-facts-${{ github.event.inputs.market || 'US' }}
  cancel-in-progress: false

jobs:
  run:
    name: Refresh stock facts weekly
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      PYTHONUNBUFFERED: "1"
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Validate required secrets
        run: test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON secret" && exit 1)

      - name: Run stock facts sync
        run: |
          MARKET="${{ github.event.inputs.market || 'US' }}"
          UNIVERSE="${{ github.event.inputs.universe || '' }}"
          MAX_WORKERS="${{ github.event.inputs.max_workers || '4' }}"
          PAUSE="${{ github.event.inputs.pause || '0.25' }}"
          LIMIT="${{ github.event.inputs.limit || '100' }}"

          CMD=(
            python -m backend.scripts.sync_stock_facts
            --market "$MARKET"
            --max-workers "$MAX_WORKERS"
            --pause "$PAUSE"
            --limit "$LIMIT"
          )

          if [ -n "$UNIVERSE" ]; then
            CMD+=(--universe "$UNIVERSE")
          fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"
