# /etc/needrestart/conf.d/stocksbrew.conf
# needrestart runs after every unattended upgrade. Its interpreter scan reads the source files of every Python and
# Node process on the box (LocalDB, the jobs, Firecrawl's workers) and peaked at 4.5 GB on Nov 14, pushing the box
# into swap. Off, a run takes 16 MB and 0.2 s; services are still restarted when a shared library (libc, openssl)
# they use is upgraded.
# Install: sudo install -m 644 backend/vps/needrestart-stocksbrew.conf /etc/needrestart/conf.d/stocksbrew.conf
$nrconf{interpscan} = 0;
