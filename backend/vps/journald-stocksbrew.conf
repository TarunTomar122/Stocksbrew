# /etc/systemd/journald.conf.d/stocksbrew.conf
# The system journal had grown to its 4.1 GB default cap (an RDP brute force on xrdp logged 61k lines an hour from
# Nov 19) while the root disk sat at 89% (Nov 21). 2 GB still holds well over the 24 h that ops-health and the daily
# health check read.
# Install: sudo install -D -m 644 backend/vps/journald-stocksbrew.conf /etc/systemd/journald.conf.d/stocksbrew.conf
#          sudo systemctl restart systemd-journald
[Journal]
SystemMaxUse=2G
