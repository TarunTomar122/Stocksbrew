# /etc/systemd/journald.conf.d/stocksbrew.conf
# The system journal had grown to its 4.1 GB default cap (an RDP brute force on xrdp logged 61k lines an hour from
# Nov 19) while the root disk sat at 89% (Nov 21). 2 GB still holds well over the 24 h that ops-health and the daily
# health check read.
# SplitMode=none (Nov 25): our services run as ubuntu, so their stdout went to user-1000.journal, and once the cap
# filled, that file's archives only reached back ~2.5 h (tikrr-web errors, job output, the [ops-health] lines) while
# the system journal still held 4 days. One journal keeps everything for the same span.
# Reading it needs sudo or the systemd-journal group (tikrr-ops-health.service has it).
# Install: sudo install -D -m 644 backend/vps/journald-stocksbrew.conf /etc/systemd/journald.conf.d/stocksbrew.conf
#          sudo systemctl restart systemd-journald
[Journal]
SystemMaxUse=2G
SplitMode=none
